mixed-port: 17890
allow-lan: false
bind-address: 127.0.0.1
port: 0
socks-port: 0
redir-port: 0
tproxy-port: 0
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: off
geodata-loader: memconservative

external-controller: 127.0.0.1:9091
secret: ""
external-ui: ui

profile:
  store-selected: true
  store-fake-ip: false

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: false

tun:
  enable: false

listeners:
  - name: openai-selective
    type: mixed
    listen: 127.0.0.1
    port: 17891
    proxy: AI
    udp: true
  - name: lan-transparent
    type: tproxy
    listen: 0.0.0.0
    port: 17893
    udp: true
  - name: node-benchmark
    type: mixed
    listen: 127.0.0.1
    port: 17894
    proxy: 家庭测速
    udp: true

proxy-groups:
  - name: 家庭测速
    type: select
    include-all-proxies: true
    exclude-filter: "(?i)剩余|到期|官网|重置"
  - name: 家庭RULE自动
    type: url-test
    include-all-proxies: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    lazy: true
    timeout: 5000
    max-failed-times: 2
  - name: 家庭RULE
    type: select
    proxies: [家庭RULE自动, DIRECT]
    include-all-proxies: true
  - name: AI-日本自动
    type: url-test
    include-all-proxies: true
    filter: "(?i)🇯🇵|日本|Japan|(^|[^A-Za-z])JP([^A-Za-z]|$)"
    exclude-filter: "(?i)剩余|到期|官网|重置"
    url: https://www.gstatic.com/generate_204
    interval: 60
    tolerance: 250
    lazy: false
    timeout: 5000
    max-failed-times: 2
  - name: AI
    type: select
    proxies: [AI-日本自动, DIRECT]
    include-all-proxies: true
    filter: "(?i)🇯🇵|日本|Japan|(^|[^A-Za-z])JP([^A-Za-z]|$)"
    exclude-filter: "(?i)剩余|到期|官网|重置"

rules:
  - MATCH,DIRECT
